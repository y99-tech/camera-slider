 stroke-linejoin="round"/><path d="M290,480 L360,480" fill="none" stroke="#7f7f7f" stroke-width="2" stroke-linejoin="round"/><path d="M290,510 L360,510" fill="none" stroke="#7f7f7f" stroke-width="2" stroke-linejoin="round"/><path d="M290,560 L360,560" fill="none" stroke="#7f7f7f" stroke-width="2" stroke-linejoin="round"/><path d="M290,590 L360,590" fill="none" stroke="#7f7f7f" stroke-width="2" stroke-linejoin="round"/><path d="M290,640 L360,640" fill="none" stroke="#7f7f7f" stroke-width="2" stroke-linejoin="round"/><text x="160" y="690" font-size="12" text-anchor="middle" fill="#333">all inputs use internal pull-ups</text><text x="330" y="880" font-size="14" text-anchor="start" fill="#333">DIY Camera Slider – wiring. Never plug/unplug the motor with power on. Set TMC2209 Vref ≈ 1.0 V.</text></svg>