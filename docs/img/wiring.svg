xt-anchor="start" font-size="13">1  coil A+</text><circle cx="1130" cy="480" r="4" fill="#334"/><text x="1138" y="485" text-anchor="start" font-size="13">2  coil A-</text><circle cx="1130" cy="510" r="4" fill="#334"/><text x="1138" y="515" text-anchor="start" font-size="13">3  coil B+</text><circle cx="1130" cy="540" r="4" fill="#334"/><text x="1138" y="545" text-anchor="start" font-size="13">4  coil B-</text><path d="M1040,450 L1130,450" fill="none" stroke="#2ca02c" stroke-width="3" stroke-linejoin="round"/><path d="M1040,480 L1130,480" fill="none" stroke="#2ca02c" stroke-width="3" stroke-linejoin="round"/><path d="M1040,510 L1130,510" fill="none" stroke="#c9a400" stroke-width="3" stroke-linejoin="round"/><path d="M1040,540 L1130,540" fill="none" stroke="#c9a400" stroke-width="3" stroke-linejoin="round"/><text x="1245" y="600" font-size="13" text-anchor="middle" fill="#333">→ NEMA17 (4-core cable)</text><text x="1245" y="618" font-size="12" text-anchor="middle" fill="#333">a coil = 2 wires with ~2 Ω between</text><rect x="1130" y="650" width="230" height="150" rx="8" fill="#f4f6f8" stroke="#334" stroke-width="2"/><text x="1245.0" y="672" text-anchor="middle" font-weight="700" font-size="16">GX12-4  ENDSTOPS</text><circle cx="1130" cy="690" r="4" fill="#334"/><text x="1138" y="695" text-anchor="start" font-size="13">1  GND (both COM)</text><circle cx="1130" cy="720" r="4" fill="#334"/><text x="1138" y="725" text-anchor="start" font-size="13">2  MIN (motor end)</text><circle cx="1130" cy="750" r="4" fill="#334"/><text x="1138" y="755" text-anchor="start" font-size="13">3  MAX (crank end)</text><circle cx="1130" cy="780" r="4" fill="#334"/><text x="1138" y="785" text-anchor="start" font-size="13">4  spare</text><path d="M620,560 L700,560 L700,720 L1130,720" fill="none" stroke="#17becf" stroke-width="3" stroke-linejoin="round"/><path d="M620,590 L690,590 L690,750 L1130,750" fill="none" stroke="#bcbd22" stroke-width="3" stroke-linejoin="round"/><path d="M650,370 L650,69