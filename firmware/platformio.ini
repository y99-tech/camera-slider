; Camera slider firmware - ESP32 (Wi-Fi + Bluetooth LE)
; Build & flash:   pio run -t upload      Serial monitor:  pio device monitor

[env:esp32dev]
platform = espressif32@^6.7.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; Wi-Fi + BLE + web UI need more than the default 1.2 MB app partition
board_build.partitions = huge_app.csv
extra_scripts = pre:scripts/embed_ui.py
lib_deps =
    gin66/FastAccelStepper@^0.31.2
    h2zero/NimBLE-Arduino@^1.4.2
build_flags =
    -DCORE_DEBUG_LEVEL=0
